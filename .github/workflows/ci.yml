name: CI

on:
  push:
    branches: [master]
  pull_request:

# A newer push makes an in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 24.x matches the Node.js version the Vercel project is pinned to,
      # so a green CI run means the same runtime the deploy builds on.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint

      # LayoutProps<"/"> and friends are generated globals. Without this the
      # checkout has no .next/types, so tsc fails with TS2304 on a clean machine.
      - run: npx next typegen

      - run: npx tsc --noEmit
      - run: npm run build
